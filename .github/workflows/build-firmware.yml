name: Build SeedSigner MicroPython Firmware

on:
  workflow_dispatch:
    inputs:
      builder_ref:
        description: "Branch/tag/SHA of seedsigner-micropython-builder to run"
        required: false
        default: "main"
      screens_ref:
        description: "Branch/tag/SHA for seedsigner-lvgl-screens (blank = use pinned submodule commit)"
        required: false
        default: ""
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

# Minimal permissions: the build job only reads the repo (checkout) and uploads
# an artifact via the Actions runtime token, which needs no repo scope. The
# GitHub Pages deploy / PR-comment / preview-cleanup jobs that required broader
# write scopes (pages/id-token/pull-requests, contents:write) have been removed.
permissions:
  contents: read

jobs:
  resolve-image-owner:
    runs-on: ubuntu-24.04
    outputs:
      owner_lc: ${{ steps.owner.outputs.owner_lc }}
    steps:
      - name: Resolve GHCR owner for the base image
        id: owner
        # Standardize on the bot account's public base image regardless of which
        # owner runs CI (upstream kdmukai or the kdmukai-bot fork). This avoids
        # each owner having to publish/maintain its own prebaked base image; the
        # bot builds and publishes it manually (see README-dev.md) and everyone
        # pulls it. The image must be public for cross-account pulls to work.
        # Mirrors GitLab/Forgejo, which already pin the kdmukai-bot registries.
        run: echo "owner_lc=kdmukai-bot" >> "$GITHUB_OUTPUT"

  build-packs:
    # Build the full language-pack collection so the merge-to-main dist ships fully
    # localized (packs baked into the vfs at /lang-packs/<locale>/...). This runs on a
    # PLAIN runner, NOT in the firmware base-image container: the pack producer is a
    # Docker image (scripts/build_packs.sh -> the pinned seedsigner-langpack-builder),
    # and the `build` job's container has no Docker socket. The container job downloads
    # the artifact this uploads and bakes it via `make dist`.
    #
    # Gated on push: PRs stay compile-only (no dist packaging), so building packs there
    # would be wasted work. See docs/ci-bake-full-langpacks-todo.md.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout seedsigner-language-packs (pinned, with submodules)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: kdmukAI-bot/seedsigner-language-packs
          # Pin the pack source for REPRODUCIBLE dists: a builder-repo commit fully
          # determines the baked packs. Its seedsigner-translations submodule (the
          # on-device .mo source) rides along at the pinned commit. Bump this ref
          # deliberately when translations or locale policy change.
          ref: 53ffccf85b3cc0b30eb1793ede773e25d22f18e1
          submodules: recursive

      - name: Build language packs (pinned reproducible Docker image)
        # build_packs.sh pulls the public, digest-pinned pack-builder image and runs the
        # producer inside it -> byte-identical output. Writes <out-dir>/<locale>/...
        # (English has no pack: it is the baked source-language floor).
        run: scripts/build_packs.sh --out-dir "$GITHUB_WORKSPACE/lang-packs"

      - name: Sanity-check the built collection
        run: |
          n=$(find "$GITHUB_WORKSPACE/lang-packs" -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "built $n locale pack(s)"
          # Guard against a silent English-only build (empty/near-empty collection).
          test "$n" -ge 2

      - name: Upload language packs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lang-packs
          path: lang-packs/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [resolve-image-owner, build-packs]
    # build-packs runs only on push. GitHub skips a job whose dependency was skipped, so
    # without this every pull request would skip the firmware build and still pass.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    # Build every supported ESP32-P4 board. All three are esp32p4 (RISC-V), so
    # they share the toolchain installed below; only the board definition differs.
    # fail-fast: false so one board's failure doesn't cancel the others' builds.
    #
    # The default build targets ESP32-P4 chip revision v3.x, the silicon now shipping.
    # Older v0.x/v1.x chips cannot run that image, so the release board also gets a
    # PRE_REV3 variant build for boards bought before the switch.
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: WAVESHARE_ESP32_P4_WIFI6_TOUCH_LCD_43
            artifact: flashable-dist-waveshare-esp32-p4-43
          - board: WAVESHARE_ESP32_P4_WIFI6_TOUCH_LCD_43
            variant: PRE_REV3
            artifact: flashable-dist-waveshare-esp32-p4-43-pre-rev3
          - board: GUITION_JC4880P443
            artifact: flashable-dist-guition-jc4880p443
          - board: WAVESHARE_ESP32_P4_WIFI6_TOUCH_LCD_35
            artifact: flashable-dist-waveshare-esp32-p4-35
    defaults:
      run:
        shell: bash
    env:
      IDF_PATH: /opt/toolchains/esp-idf
      IDF_DIR: /opt/toolchains/esp-idf
      IDF_TOOLS_PATH: /opt/espressif
      # ESP32-P4 is the first-release target; CI builds the P4 boards (RISC-V).
      IDF_TOOLS_TARGETS: esp32p4
      BOARD: ${{ matrix.board }}
      BOARD_VARIANT: ${{ matrix.variant }}
      # build/ and dist/ subdir: <BOARD>, or <BOARD>-<VARIANT> for a variant build.
      BUILD_NAME: ${{ matrix.variant && format('{0}-{1}', matrix.board, matrix.variant) || matrix.board }}
      # ccache: the launcher wiring is already in place -- the base image ships
      # ccache and build_firmware.sh passes IDF_CCACHE_ENABLE=1, which routes the
      # IDF CMake compiler launcher through ccache. What was missing is cross-run
      # persistence: point CCACHE_DIR at the workspace (NOT $HOME, which differs
      # between steps in a container job) so actions/cache can save/restore it.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "2G"
    container:
      # Pinned to the ESP-IDF baseline tag (matches ESP_IDF_REF in the Dockerfile), not
      # :latest, so publishing a new base image never changes what an existing ref builds.
      image: ghcr.io/${{ needs.resolve-image-owner.outputs.owner_lc }}/seedsigner-micropython-builder-base:idf-v5.5.5
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.builder_ref || github.ref }}
          submodules: true

      - name: Init nested submodules not covered by non-recursive checkout
        run: |
          # actions/checkout inits submodules non-recursively, so the nested
          # submodules two levels down are absent -- and the build needs them:
          #   board_common -> esp-camera-pipeline -> k_quirc   (ESP-IDF component)
          #   esp-secp256k1 -> secp256k1-zkp                   (libsecp256k1 amalgamation)
          # All submodule URLs in these subtrees are now public HTTPS GitHub, so they
          # resolve anonymously with no URL rewrite. Scope recursion to these
          # subtrees so MicroPython's own deep submodules are not pulled.
          # The workspace repo is owned by a different uid than this step's user and
          # checkout's safe.directory exception only lives under its temporary HOME,
          # so re-add it here or git aborts with "dubious ownership".
          git config --global --add safe.directory '*'
          git submodule update --init --recursive ports/esp32/board_common deps/seedsigner-lvgl-screens deps/esp-secp256k1

      - name: Prepare sources workspace from prebaked image
        run: |
          mkdir -p deps
          ./scripts/prepare_sources_from_image.sh "$PWD/deps"

      - name: Override lvgl-screens ref (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.screens_ref != ''
        run: |
          git -C deps/seedsigner-lvgl-screens fetch origin
          git -C deps/seedsigner-lvgl-screens checkout ${{ inputs.screens_ref }}

      - name: Ensure baked ESP-IDF tools environment
        run: |
          test -d /opt/toolchains/esp-idf
          mkdir -p "$IDF_TOOLS_PATH"
          # The base image bakes the esp32s3 toolchain; the P4 (RISC-V) needs the
          # esp32p4 toolset. install is idempotent: the riscv32-esp-elf compiler
          # may already be present (the S3 ULP uses it), but make it explicit.
          python3 "$IDF_PATH/tools/idf_tools.py" install --targets=esp32p4
          python3 "$IDF_PATH/tools/idf_tools.py" install riscv32-esp-elf-gdb
          source "$IDF_PATH/export.sh"
          idf.py --version

      - name: Stage frozen app (merge to main only)
        # PRs stay compile-only (no frozen_app/ -> manifest try/except skips the
        # freeze). On push to main, stage the app+embit from the pinned deps/
        # submodules so the build below bakes them in and `make dist` can publish a
        # self-booting image. Version comes from deps/seedsigner git via env.
        if: github.event_name == 'push'
        run: ./scripts/ci/ci.sh stage-frozen

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          # Unique per-run key so the post-job save is NEVER skipped: actions/cache
          # skips saving on an exact primary-key hit, which would freeze the cache
          # at its first contents (0 MB) -- the trap that kept seedsigner-raspi-lvgl
          # cold for weeks. run_attempt keeps re-runs unique too. The prefix
          # restore-key pulls the newest prior cache; PR builds warm from main's.
          key: ccache-firmware-${{ env.BUILD_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-firmware-${{ env.BUILD_NAME }}-

      - name: Configure ccache
        # Fail loudly if the base image ever loses the binary: IDF's CMake launcher
        # only warns and compiles cold when ccache is absent. Zero stats so the
        # post-build report reflects only this run.
        run: |
          command -v ccache
          ccache --version
          ccache --zero-stats
          ccache -p | grep -Ei 'cache_dir|max_size' || true

      - name: Build firmware
        run: ./scripts/ci_build.sh "$PWD/deps"

      - name: Report ccache stats
        # Visibility is the whole point -- a "hits" line is the only proof the
        # cache is live. raspi-lvgl printed "ccache enabled" for weeks while 100%
        # cold. Runs on failure too, so a broken build still shows cache state.
        if: always()
        run: ccache --show-stats --verbose || ccache --show-stats || true

      - name: Record build provenance
        run: |
          mkdir -p logs
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "builder_ref=${{ github.event_name == 'workflow_dispatch' && inputs.builder_ref || github.ref }}"
            echo "screens_ref_input=${{ github.event_name == 'workflow_dispatch' && inputs.screens_ref || 'pinned-submodule' }}"
            echo "micropython_head=$(git -C deps/micropython/upstream rev-parse HEAD)"
            echo "screens_head=$(git -C deps/seedsigner-lvgl-screens rev-parse HEAD)"
            echo "idf_head=$(git -C "$IDF_PATH" rev-parse HEAD)"
            echo "idf_version=$(source "$IDF_PATH/export.sh" >/dev/null 2>&1; idf.py --version 2>/dev/null || true)"
            echo "python=$(python3 --version 2>&1)"
            echo "cmake=$(cmake --version | head -n1)"
          } | tee logs/provenance.txt

      - name: Download language packs (merge to main only)
        # The collection built by the build-packs job (plain runner). Lands the locale
        # dirs under lang-packs-staging/ for the dist bake below.
        if: github.event_name == 'push'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: lang-packs
          path: lang-packs-staging

      - name: Package flashable dist (merge to main only)
        # Firmware + baked /main.py launcher image + language packs -> dist/<BOARD>/ with
        # a flash_args that includes the vfs partition, so `esptool write_flash @flash_args`
        # yields a board that boots the FULLY LOCALIZED app on first power-up (no REPL,
        # no microSD). The packs come from the build-packs job's artifact; make dist bakes
        # them into the vfs via SS_PACKS_DIR (resolve_packs()). See
        # docs/ci-bake-full-langpacks-todo.md and BUILDER-13.
        if: github.event_name == 'push'
        run: |
          staging="$GITHUB_WORKSPACE/lang-packs-staging"
          # Locate the dir that holds the locale packs (each is <locale>/manifest.json),
          # tolerant of any extra nesting the artifact packaging introduces.
          manifest="$(find "$staging" -name manifest.json -print -quit 2>/dev/null || true)"
          if [ -z "$manifest" ]; then
            echo "::error::no language packs found under $staging (English-only would ship)"
            ls -R "$staging" 2>/dev/null || true
            exit 1
          fi
          packs_dir="$(dirname "$(dirname "$manifest")")"
          echo "[dist] baking packs from $packs_dir"
          SS_PACKS_DIR="$packs_dir" make dist BOARD="$BOARD"
          # Verify the localized image actually baked: a launcher-only (English) vfs is
          # ~tens of KB; the full pack collection pushes vfs.bin well past 1 MB.
          vfs="dist/$BUILD_NAME/vfs.bin"
          test -f "$vfs"
          sz=$(stat -c%s "$vfs")
          echo "[dist] $vfs = $sz bytes"
          test "$sz" -gt 1000000

      - name: Upload flashable dist (merge to main only)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ env.BUILD_NAME }}/
